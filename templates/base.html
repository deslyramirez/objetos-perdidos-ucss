{#-
  Base layout: admin-style shell (sidebar + top bar), flash messages, content and footer.

  BLOCKS (all optional except content)
    title    Page title. Rendered as "<title>{title} · Objetos perdidos</title>"; empty -> "Objetos perdidos".
    head     Extra <head> content (meta tags, page-specific <link>/<style>).
    content  Page body, rendered inside the centered content container below the flash messages.
    scripts  Page-specific scripts, rendered at the end of <body>.

  LAYOUT BLOCKS (the defaults reproduce the standard application shell; override them only for
  special full-screen pages such as login.html and register.html, which empty header/footer)
    body_class  Classes of <body>.
    header      Sidebar (signed-in users) and the top bar <header> (rendered after the skip link).
    flash       Flash messages, rendered at the top of <main> before content.
    main_class  Classes of <main id="main-content">.
    footer      The global <footer>.

  SECTIONS
    Each screen belongs to a section (see `sections` below) that gives it a breadcrumb label,
    an icon and an accent color. The color is exposed as the CSS variable --c on <body> and is
    reused by the active sidebar item, the page header icon and table headers.

  Shared components live in static/css/app.css (classes) and templates/_macros.html (macros).
  Context provided by the app: current_year and avatar_url().
-#}
{%- from "_macros.html" import flash_messages, csrf_field -%}
{%- set page_title %}{% block title %}{% endblock %}{% endset -%}
{%- set endpoint = request.endpoint or '' -%}
{%- set sections = {
  'reports': ('Centro de reportes', 'bi-collection', '#0d97a4'),
  'add': ('Nuevo reporte', 'bi-plus-circle', '#e0673f'),
  'dashboard': ('Panel mensual', 'bi-bar-chart-line', '#2a6f9a'),
  'import': ('Importar CSV', 'bi-upload', '#c27a16'),
  'export': ('Exportar CSV', 'bi-download', '#2f9e6e'),
  'messages': ('Mensajes', 'bi-chat-dots', '#7a4fb5'),
  'account': ('Mi cuenta', 'bi-person-circle', '#355a6e')
} -%}
{%- if endpoint.startswith('dashboard.') %}{% set section = 'dashboard' %}
{%- elif endpoint == 'main.add' %}{% set section = 'add' %}
{%- elif endpoint == 'main.import_csv' %}{% set section = 'import' %}
{%- elif endpoint.startswith('profile.') %}{% set section = 'account' %}
{%- elif endpoint.startswith('messages.') %}{% set section = 'messages' %}
{%- else %}{% set section = 'reports' %}{% endif -%}
{%- macro nav_link(href, key, active=False, badge=0) -%}
{%- set label, icon, color = sections[key] -%}
<a href="{{ href }}" style="--c: {{ color }}"
   class="app-nav-link {{ 'is-active' if active else '' }}"
   {%- if active %} aria-current="page"{% endif %}>
  <i class="bi {{ icon }}" aria-hidden="true"></i><span>{{ label }}</span>
  {%- if badge %}<span class="nav-badge" aria-label="{{ badge }} sin leer">{{ badge }}</span>{% endif %}
</a>
{%- endmacro -%}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title|trim %}{{ page_title|trim }} · Objetos perdidos{% else %}Objetos perdidos{% endif %}</title>

    <!-- Tailwind (Play CDN, pinned) and theme -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eafafd',
                            100: '#d5f3f7',
                            200: '#a9e7ef',
                            300: '#73d4df',
                            400: '#39a1c4',
                            500: '#00a2c5',
                            600: '#0d97a4',
                            700: '#196593',
                            800: '#154462',
                            900: '#0f344a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Fonts and icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Design system components -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=33) }}">
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}app-shell{{ ' has-sidebar' if current_user.is_authenticated }} flex min-h-screen flex-col font-sans text-slate-900 antialiased{% endblock %}" style="--c: {{ sections[section][2] }}">

    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded-md focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:shadow">
        Saltar al contenido
    </a>

    {% block header %}
    {% if current_user.is_authenticated %}
    <!-- SIDEBAR -->
    <aside id="nav-menu" class="app-sidebar" aria-label="Navegación principal">
        <a href="{{ url_for('dashboard.home') }}" class="brand-lockup" aria-label="Objetos perdidos · Universidad Católica Sedes Sapientiae">
            <span class="brand-logo-panel"><img class="brand-logo" src="{{ url_for('static', filename='img/ucss-logo.png', v=2) }}" alt="Universidad Católica Sedes Sapientiae (UCSS)"></span>
            <span class="brand-product">Objetos perdidos<small>Gestión UCSS</small></span>
        </a>

        <nav class="app-sidebar__nav">
            <div class="app-sidebar__section">
                <p class="app-sidebar__group">General</p>
                {{ nav_link(url_for('dashboard.home'), 'dashboard', section == 'dashboard') }}
            </div>
            <div class="app-sidebar__section">
                <p class="app-sidebar__group">Reportes</p>
                {{ nav_link(url_for('main.index'), 'reports', section == 'reports') }}
                {{ nav_link(url_for('main.add'), 'add', section == 'add') }}
                {{ nav_link(url_for('messages.inbox'), 'messages', section == 'messages', unread_messages) }}
            </div>
            <div class="app-sidebar__section">
                <p class="app-sidebar__group">Datos</p>
                {{ nav_link(url_for('main.import_csv'), 'import', section == 'import') }}
                {{ nav_link(url_for('main.export_csv'), 'export') }}
            </div>
        </nav>

    </aside>
    <div class="app-sidebar__backdrop" data-nav-close hidden></div>
    {% endif %}

    <!-- TOP BAR -->
    <header class="app-header">
        <div class="app-header__inner">
            <button type="button" id="nav-toggle"
                    class="app-menu-toggle"
                    aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir menú">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            {% if current_user.is_authenticated %}
            <p class="app-breadcrumb">
                <a href="{{ url_for('dashboard.home') }}">Objetos perdidos</a>
                <span aria-hidden="true">/</span>
                <strong>{{ sections[section][0] }}</strong>
            </p>

            <div class="app-header__actions">
                <!-- User menu -->
                <div class="relative" id="user-menu-wrapper">
                    <button type="button" id="user-menu-btn"
                            class="app-user-button"
                            aria-haspopup="true" aria-expanded="false" aria-controls="user-menu">
                        <img src="{{ avatar_url(current_user) }}"
                             alt="Avatar de {{ current_user.username }}">
                        <span>{{ current_user.username }}</span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>

                    <div id="user-menu" class="app-user-menu hidden">
                        <p class="app-user-menu__head">{{ current_user.username }}<small>{{ current_user.email or 'Cuenta UCSS' }}</small>{% if current_user.is_admin %}<span class="admin-badge"><i class="bi bi-shield-check" aria-hidden="true"></i> Administrador</span>{% endif %}</p>
                        <a href="{{ url_for('profile.view_profile') }}" class="app-user-menu__item"><i class="bi bi-person" aria-hidden="true"></i>Perfil</a>
                        <a href="{{ url_for('profile.change_password') }}" class="app-user-menu__item"><i class="bi bi-key" aria-hidden="true"></i>Cambiar contraseña</a>
                        <form method="post" action="{{ url_for('auth.logout') }}">
                            {{ csrf_field() }}
                            <button type="submit" class="app-user-menu__item app-user-menu__item--danger">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            {% else %}
            <a href="{{ url_for('main.index') }}" class="brand-lockup" aria-label="Objetos perdidos · Universidad Católica Sedes Sapientiae">
                <span class="brand-logo-panel"><img class="brand-logo" src="{{ url_for('static', filename='img/ucss-logo.png', v=2) }}" alt="Universidad Católica Sedes Sapientiae (UCSS)"></span>
                <span class="brand-product">Objetos perdidos</span>
            </a>
            <div id="nav-menu" class="app-nav-menu app-header__actions">
                <a href="{{ url_for('auth.login') }}" class="btn btn-ghost">Iniciar sesión</a>
                <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Registrarse</a>
            </div>
            {% endif %}
        </div>
    </header>
    {% endblock %}

    <!-- MAIN CONTENT -->
    <main id="main-content" class="{% block main_class %}page-shell mx-auto w-full max-w-6xl flex-1 px-4 py-8{% endblock %}">
        {% block flash %}{{ flash_messages() }}{% endblock %}
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <!-- FOOTER -->
    <footer class="app-footer">
        <div class="app-footer__inner">
            © {{ current_year }} Objetos perdidos <span aria-hidden="true">·</span> Universidad Católica Sedes Sapientiae
        </div>
    </footer>
    {% endblock %}

    <!-- Navigation, user menu and flash behavior (every lookup is null-checked) -->
    <script>
        (function () {
            var navToggle = document.getElementById("nav-toggle");
            var navMenu = document.getElementById("nav-menu");
            var backdrop = document.querySelector("[data-nav-close]");
            if (navToggle && navMenu) {
                var setNav = function (open) {
                    navMenu.classList.toggle("is-open", open);
                    navToggle.setAttribute("aria-expanded", open ? "true" : "false");
                    if (backdrop) { backdrop.hidden = !open; }
                };
                navToggle.addEventListener("click", function () {
                    setNav(!navMenu.classList.contains("is-open"));
                });
                if (backdrop) {
                    backdrop.addEventListener("click", function () { setNav(false); });
                }
            }

            var userButton = document.getElementById("user-menu-btn");
            var userMenu = document.getElementById("user-menu");
            if (userButton && userMenu) {
                var closeUserMenu = function () {
                    userMenu.classList.add("hidden");
                    userButton.setAttribute("aria-expanded", "false");
                };
                userButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    var hidden = userMenu.classList.toggle("hidden");
                    userButton.setAttribute("aria-expanded", hidden ? "false" : "true");
                });
                document.addEventListener("click", function (event) {
                    if (!userMenu.contains(event.target) && !userButton.contains(event.target)) {
                        closeUserMenu();
                    }
                });
                document.addEventListener("keydown", function (event) {
                    if (event.key === "Escape") {
                        closeUserMenu();
                    }
                });
            }

            var closeButtons = document.querySelectorAll("[data-flash-close]");
            for (var i = 0; i < closeButtons.length; i++) {
                closeButtons[i].addEventListener("click", function (event) {
                    var alertBox = event.currentTarget.closest("[data-flash]");
                    if (alertBox) {
                        alertBox.remove();
                    }
                });
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
